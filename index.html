<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100%;
      height: 100%;
      background: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 90px;
      height: 100vh;
      background: #f8f8f8;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      z-index: 1000;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .section-label {
      font-size: 9px;
      font-weight: bold;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 5px;
    }
    
    .btn {
      width: 70px;
      padding: 8px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      color: #333;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    
    .btn:hover {
      background: #f0f0f0;
      border-color: #999;
    }
    
    .btn.active {
      background: #333;
      color: white;
      border-color: #333;
    }
    
    .btn.recording {
      background: #e74c3c;
      color: white;
      border-color: #e74c3c;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .emoji { font-size: 20px; }
    
    #colorInput {
      width: 70px;
      height: 35px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    
    #sizeSlider {
      width: 65px;
      height: 3px;
      cursor: pointer;
    }
    
    .size-value {
      font-size: 9px;
      color: #666;
      text-align: center;
    }
    
    #stats {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.9);
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      color: #666;
      font-family: monospace;
      z-index: 999;
    }
    
    #recordingIndicator {
      position: fixed;
      top: 10px;
      left: 110px;
      background: #e74c3c;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 999;
      display: none;
      animation: pulse 1s infinite;
    }
    
    #recordingIndicator.active {
      display: block;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      text-align: center;
    }
    
    .modal h2 {
      margin: 0 0 20px 0;
      font-size: 16px;
      color: #333;
    }
    
    #colorWheelCanvas {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px solid #ddd;
      margin: 0 auto 20px;
      cursor: crosshair;
      display: block;
    }
    
    #colorPreview {
      width: 100%;
      height: 50px;
      border: 2px solid #ddd;
      border-radius: 4px;
      margin: 0 0 20px 0;
      background: #000;
    }
    
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .modal-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .btn-confirm {
      background: #333;
      color: white;
    }
    
    .btn-cancel {
      background: #ddd;
      color: #333;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="stats">Zoom: 1.0x | Pressure: 0% | Strokes: 0</div>
  <div id="recordingIndicator">● REC <span id="recordingTime">00:00</span></div>
  
  <div id="sidebar">
    <div class="section">
      <div class="section-label">Tools</div>
      <button class="btn active" data-tool="pen"><span class="emoji">🖊️</span>Pen</button>
      <button class="btn" data-tool="brush"><span class="emoji">🖌️</span>Brush</button>
      <button class="btn" data-tool="marker"><span class="emoji">🖍️</span>Marker</button>
      <button class="btn" data-tool="ink"><span class="emoji">✒️</span>Ink</button>
      <button class="btn" data-tool="pencil"><span class="emoji">✏️</span>Pencil</button>
    </div>
    
    <div class="section">
      <div class="section-label">Size</div>
      <input type="range" id="sizeSlider" min="1" max="50" value="3">
      <div class="size-value"><span id="sizeValue">3</span>px</div>
    </div>
    
    <div class="section">
      <div class="section-label">Color</div>
      <input type="color" id="colorInput" value="#000000">
    </div>
    
    <div class="section">
      <div class="section-label">Utilities</div>
      <button class="btn" id="colorWheelBtn"><span class="emoji">🎨</span>Wheel</button>
      <button class="btn" id="undoBtn"><span class="emoji">↶</span>Undo</button>
      <button class="btn" id="clearBtn"><span class="emoji">🗑️</span>Clear</button>
      <button class="btn" id="downloadBtn"><span class="emoji">⬇️</span>Save</button>
    </div>

    <div class="section">
      <div class="section-label">Record</div>
      <button class="btn" id="recordBtn"><span class="emoji">⏺️</span>Record</button>
    </div>
  </div>
  
  <div id="colorWheelModal" class="modal">
    <div class="modal-content">
      <h2>Color Wheel</h2>
      <canvas id="colorWheelCanvas"></canvas>
      <div id="colorPreview"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeColorWheel()">Cancel</button>
        <button class="btn-confirm" onclick="confirmColorWheel()">Use Color</button>
      </div>
    </div>
  </div>

  <script>
    // ===== VECTOR-BASED INFINITE CANVAS WITH FRACTAL RENDERING =====
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { 
      willReadFrequently: true,
      alpha: true,
      antialias: true
    });
    
    // High DPI support
    const dpr = window.devicePixelRatio || 1;
    
    function resizeCanvas() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // ===== VECTOR MATH =====
    class Vec2 {
      constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
      }
      
      add(v) {
        return new Vec2(this.x + v.x, this.y + v.y);
      }
      
      sub(v) {
        return new Vec2(this.x - v.x, this.y - v.y);
      }
      
      mul(scalar) {
        return new Vec2(this.x * scalar, this.y * scalar);
      }
      
      div(scalar) {
        return new Vec2(this.x / scalar, this.y / scalar);
      }
      
      dot(v) {
        return this.x * v.x + this.y * v.y;
      }
      
      length() {
        return Math.sqrt(this.x * this.x + this.y * this.y);
      }
      
      normalize() {
        const len = this.length();
        return len > 0 ? this.div(len) : new Vec2(0, 0);
      }
      
      distance(v) {
        return this.sub(v).length();
      }
      
      lerp(v, t) {
        return this.add(v.sub(this).mul(t));
      }
      
      clone() {
        return new Vec2(this.x, this.y);
      }
    }
    
    // ===== VECTOR STROKE =====
    class Stroke {
      constructor(tool, color, baseSize) {
        this.points = []; // Array of {pos: Vec2, pressure: number, timestamp: number}
        this.tool = tool;
        this.color = color;
        this.baseSize = baseSize;
      }
      
      addPoint(pos, pressure, timestamp) {
        this.points.push({ pos: pos.clone(), pressure, timestamp });
      }
      
      getSegment(startIdx, endIdx) {
        return this.points.slice(startIdx, endIdx + 1);
      }
    }
    
    // ===== BRUSH DYNAMICS (Endless Paper Style) =====
    const brushDynamics = {
      pen: {
        baseWidth: 1.5,
        pressureSensitivity: 0.8,
        velocityTaper: 0.2,
        softness: 0,
        opacity: 1
      },
      brush: {
        baseWidth: 4,
        pressureSensitivity: 1,
        velocityTaper: 0.5,
        softness: 0.4,
        opacity: 0.8
      },
      marker: {
        baseWidth: 6,
        pressureSensitivity: 0.5,
        velocityTaper: 0.3,
        softness: 0.6,
        opacity: 0.7
      },
      ink: {
        baseWidth: 2,
        pressureSensitivity: 1,
        velocityTaper: 0.1,
        softness: 0,
        opacity: 1
      },
      pencil: {
        baseWidth: 1,
        pressureSensitivity: 0.7,
        velocityTaper: 0.4,
        softness: 0.2,
        opacity: 0.9
      }
    };
    
    // ===== FRACTAL RENDERING ENGINE =====
    class FractalRenderer {
      constructor(ctx, zoom) {
        this.ctx = ctx;
        this.zoom = zoom;
        this.layers = new Map(); // LOD (Level of Detail) layers
      }
      
      // Compute width based on velocity and pressure (Endless Paper style)
      computeWidth(prevPos, currPos, pressure, dynamics) {
        const velocity = prevPos ? prevPos.distance(currPos) : 0;
        const velocityFactor = Math.pow(Math.max(0.1, 1 - velocity * 0.01), dynamics.velocityTaper);
        const widthFromPressure = dynamics.baseWidth * (0.5 + pressure * dynamics.pressureSensitivity);
        return widthFromPressure * velocityFactor * (1 / this.zoom);
      }
      
      // Render stroke with adaptive sampling (fractal subdivision)
      renderStroke(stroke, startIdx = 0, endIdx = null) {
        if (endIdx === null) endIdx = stroke.points.length - 1;
        if (startIdx >= endIdx) return;
        
        const dynamics = brushDynamics[stroke.tool];
        const points = stroke.points;
        
        // Adaptive Catmull-Rom spline with fractal subdivision
        for (let i = startIdx; i < endIdx; i++) {
          const p0 = i > 0 ? points[i - 1].pos : points[i].pos;
          const p1 = points[i].pos;
          const p2 = points[i + 1].pos;
          const p3 = i < points.length - 2 ? points[i + 2].pos : points[i + 1].pos;
          
          const pressure1 = points[i].pressure;
          const pressure2 = points[i + 1].pressure;
          
          // Fractal subdivision - draw multiple segments for smooth curves
          const segments = Math.max(2, Math.ceil(p1.distance(p2) * 0.5));
          
          for (let t = 0; t < segments; t++) {
            const tau = t / segments;
            const tau2 = tau * tau;
            const tau3 = tau2 * tau;
            
            // Catmull-Rom interpolation
            const q = p0.mul(-0.5 * tau3 + tau2 - 0.5 * tau)
              .add(p1.mul(1.5 * tau3 - 2.5 * tau2 + 1))
              .add(p2.mul(-1.5 * tau3 + 2 * tau2 + 0.5 * tau))
              .add(p3.mul(0.5 * tau3 - 0.5 * tau2));
            
            const pressure = pressure1 + (pressure2 - pressure1) * tau;
            const width = this.computeWidth(p1, q, pressure, dynamics);
            
            // Render with softness (fractal brush texture)
            this.drawBrushPoint(q, width, stroke.color, dynamics);
          }
        }
      }
      
      // Fractal brush point rendering with soft edges
      drawBrushPoint(pos, width, color, dynamics) {
        const ctx = this.ctx;
        
        ctx.fillStyle = color;
        ctx.globalAlpha = dynamics.opacity;
        
        const actualWidth = Math.max(0.5, width);
        
        if (dynamics.softness > 0.5) {
          // Soft brush - fractal gradient
          const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, actualWidth);
          gradient.addColorStop(0, color);
          gradient.addColorStop(1, color + '00');
          ctx.fillStyle = gradient;
        }
        
        // Draw circle with dynamic scaling
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, actualWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    
    // ===== STATE MANAGEMENT =====
    let state = {
      tool: 'pen',
      color: '#000000',
      size: 3,
      zoom: 1,
      panX: 0,
      panY: 0,
      isDrawing: false,
      pressure: 0,
      touchCount: 0,
      lastTouchDistance: 0,
      isRecording: false,
      velocity: new Vec2(0, 0)
    };
    
    let strokes = []; // All vector strokes
    let currentStroke = null;
    let history = [];
    let selectedColor = '#000000';
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartTime = 0;
    let recordingInterval = null;
    let renderer = new FractalRenderer(ctx, state.zoom);
    
    let lastX = 0, lastY = 0;
    let lastTime = 0;
    
    // ===== RENDERING LOOP =====
    function render() {
      // Clear canvas
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      
      // Apply pan and zoom transforms
      ctx.save();
      ctx.translate(state.panX, state.panY);
      ctx.scale(state.zoom, state.zoom);
      
      // Draw all strokes
      for (const stroke of strokes) {
        renderer.renderStroke(stroke);
      }
      
      ctx.restore();
      
      requestAnimationFrame(render);
    }
    render();
    
    // ===== POINTER EVENTS =====
    canvas.addEventListener('pointerdown', (e) => {
      if (state.touchCount > 0 && e.pointerType === 'touch') return;
      if (e.button !== 0) return;
      
      state.isDrawing = true;
      state.pressure = e.pressure || 0.5;
      
      const pos = new Vec2(
        (e.clientX - state.panX) / state.zoom,
        (e.clientY - state.panY) / state.zoom
      );
      
      lastX = pos.x;
      lastY = pos.y;
      lastTime = performance.now();
      
      currentStroke = new Stroke(state.tool, state.color, state.size);
      currentStroke.addPoint(pos, state.pressure, lastTime);
      
      history.push(JSON.stringify(strokes));
      if (history.length > 50) history.shift();
    });
    
    canvas.addEventListener('pointermove', (e) => {
      if (!state.isDrawing || e.isPrimary === false) return;
      
      state.pressure = e.pressure || 0.5;
      
      const pos = new Vec2(
        (e.clientX - state.panX) / state.zoom,
        (e.clientY - state.panY) / state.zoom
      );
      
      const now = performance.now();
      const deltaTime = now - lastTime;
      
      if (deltaTime > 0) {
        state.velocity = new Vec2(
          (pos.x - lastX) / deltaTime,
          (pos.y - lastY) / deltaTime
        );
      }
      
      currentStroke.addPoint(pos, state.pressure, now);
      lastX = pos.x;
      lastY = pos.y;
      lastTime = now;
      
      updateStats();
    });
    
    canvas.addEventListener('pointerup', () => {
      if (state.isDrawing && currentStroke) {
        strokes.push(currentStroke);
        currentStroke = null;
      }
      state.isDrawing = false;
      state.pressure = 0;
    });
    
    canvas.addEventListener('pointerleave', () => {
      if (state.isDrawing && currentStroke) {
        strokes.push(currentStroke);
        currentStroke = null;
      }
      state.isDrawing = false;
    });
    
    // ===== TOUCH ZOOM (FIXED) =====
    canvas.addEventListener('touchstart', (e) => {
      state.touchCount = e.touches.length;
      
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        state.lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
      }
    }, { passive: true });
    
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2) {
        e.preventDefault();
        
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const currentDistance = Math.sqrt(dx * dx + dy * dy);
        
        if (state.lastTouchDistance > 0) {
          const ratio = currentDistance / state.lastTouchDistance;
          const pinchCenter = new Vec2(
            (e.touches[0].clientX + e.touches[1].clientX) / 2,
            (e.touches[0].clientY + e.touches[1].clientY) / 2
          );
          
          // Zoom towards pinch center
          const oldZoom = state.zoom;
          state.zoom *= ratio;
          state.zoom = Math.max(0.01, Math.min(state.zoom, 1000));
          
          // Adjust pan to keep center fixed
          state.panX = pinchCenter.x - (pinchCenter.x - state.panX) * (state.zoom / oldZoom);
          state.panY = pinchCenter.y - (pinchCenter.y - state.panY) * (state.zoom / oldZoom);
          
          renderer.zoom = state.zoom;
          state.lastTouchDistance = currentDistance;
          updateStats();
        }
      }
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
      state.touchCount = e.touches.length;
      state.lastTouchDistance = 0;
    }, { passive: true });
    
    // ===== MOUSE WHEEL ZOOM =====
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      
      const delta = e.deltaY > 0 ? 0.95 : 1.05;
      const oldZoom = state.zoom;
      state.zoom *= delta;
      state.zoom = Math.max(0.01, Math.min(state.zoom, 1000));
      
      // Zoom towards mouse position
      state.panX = e.clientX - (e.clientX - state.panX) * (state.zoom / oldZoom);
      state.panY = e.clientY - (e.clientY - state.panY) * (state.zoom / oldZoom);
      
      renderer.zoom = state.zoom;
      updateStats();
    }, { passive: false });
    
    // ===== PAN (RIGHT CLICK) =====
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
      }
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isPanning) {
        state.panX += e.clientX - panStartX;
        state.panY += e.clientY - panStartY;
        panStartX = e.clientX;
        panStartY = e.clientY;
      }
    });
    
    canvas.addEventListener('mouseup', () => {
      isPanning = false;
    });
    
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // ===== UI CONTROLS =====
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        e.target.closest('.btn').classList.add('active');
        state.tool = e.target.closest('.btn').dataset.tool;
      });
    });
    
    document.getElementById('sizeSlider').addEventListener('input', (e) => {
      state.size = parseInt(e.target.value);
      document.getElementById('sizeValue').textContent = state.size;
    });
    
    document.getElementById('colorInput').addEventListener('change', (e) => {
      state.color = e.target.value;
    });
    
    document.getElementById('colorWheelBtn').addEventListener('click', () => {
      document.getElementById('colorWheelModal').classList.add('active');
      drawColorWheel();
    });
    
    document.getElementById('undoBtn').addEventListener('click', () => {
      if (strokes.length > 0) {
        strokes.pop();
      }
    });
    
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Clear canvas?')) {
        strokes = [];
        history = [];
      }
    });
    
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = `canvas-${Date.now()}.png`;
      link.click();
    });
    
    document.getElementById('recordBtn').addEventListener('click', () => {
      if (!state.isRecording) startRecording();
      else stopRecording();
    });
    
    async function startRecording() {
      try {
        const stream = await canvas.captureStream(60);
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp9',
          videoBitsPerSecond: 5000000
        });
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `canvas-recording-${Date.now()}.webm`;
          link.click();
          URL.revokeObjectURL(url);
        };
        
        mediaRecorder.start();
        state.isRecording = true;
        recordingStartTime = Date.now();
        
        recordingInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
          const minutes = Math.floor(elapsed / 60);
          const seconds = elapsed % 60;
          document.getElementById('recordingTime').textContent = 
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }, 100);
        
        document.getElementById('recordBtn').classList.add('recording');
        document.getElementById('recordingIndicator').classList.add('active');
      } catch (err) {
        alert('Recording not supported');
      }
    }
    
    function stopRecording() {
      if (mediaRecorder && state.isRecording) {
        mediaRecorder.stop();
        state.isRecording = false;
        clearInterval(recordingInterval);
        document.getElementById('recordBtn').classList.remove('recording');
        document.getElementById('recordingIndicator').classList.remove('active');
        document.getElementById('recordingTime').textContent = '00:00';
      }
    }
    
    function drawColorWheel() {
      const wheelCanvas = document.getElementById('colorWheelCanvas');
      const wheelCtx = wheelCanvas.getContext('2d');
      const centerX = wheelCanvas.width / 2;
      const centerY = wheelCanvas.height / 2;
      const radius = 140;
      
      wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
      
      for (let angle = 0; angle < 360; angle++) {
        for (let r = 0; r < radius; r++) {
          const hue = angle;
          const saturation = 100 * (r / radius);
          wheelCtx.fillStyle = `hsl(${hue}, ${saturation}%, 50%)`;
          wheelCtx.beginPath();
          wheelCtx.arc(centerX, centerY, r, angle * Math.PI / 180, (angle + 1) * Math.PI / 180);
          wheelCtx.lineTo(centerX, centerY);
          wheelCtx.fill();
        }
      }
      wheelCanvas.addEventListener('click', selectColorFromWheel);
    }
    
    function selectColorFromWheel(e) {
      const rect = e.target.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const x = e.clientX - rect.left - centerX;
      const y = e.clientY - rect.top - centerY;
      const angle = Math.atan2(y, x) * 180 / Math.PI + 180;
      const distance = Math.sqrt(x * x + y * y);
      const saturation = 100 * Math.min(distance / 140, 1);
      selectedColor = `hsl(${angle}, ${saturation}%, 50%)`;
      document.getElementById('colorPreview').style.background = selectedColor;
    }
    
    window.closeColorWheel = () => {
      document.getElementById('colorWheelModal').classList.remove('active');
    };
    
    window.confirmColorWheel = () => {
      state.color = selectedColor;
      document.getElementById('colorInput').value = selectedColor;
      document.getElementById('colorWheelModal').classList.remove('active');
    };
    
    function updateStats() {
      const pressurePercent = Math.round(state.pressure * 100);
      document.getElementById('stats').textContent = 
        `Zoom: ${state.zoom.toFixed(2)}x | Pressure: ${pressurePercent}% | Strokes: ${strokes.length}`;
    }
  </script>
</body>
</html>
