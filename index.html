<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100%;
      height: 100%;
      background: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    
    /* Sidebar */
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 90px;
      height: 100vh;
      background: #f8f8f8;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      z-index: 1000;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .section-label {
      font-size: 9px;
      font-weight: bold;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 5px;
    }
    
    .btn {
      width: 70px;
      padding: 8px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      color: #333;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    
    .btn:hover {
      background: #f0f0f0;
      border-color: #999;
    }
    
    .btn.active {
      background: #333;
      color: white;
      border-color: #333;
    }
    
    .emoji {
      font-size: 20px;
    }
    
    #colorInput {
      width: 70px;
      height: 35px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    
    #sizeSlider {
      width: 65px;
      height: 3px;
      cursor: pointer;
    }
    
    .size-value {
      font-size: 9px;
      color: #666;
      text-align: center;
    }
    
    #stats {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.9);
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      color: #666;
      font-family: monospace;
      z-index: 999;
    }
    
    /* Color Wheel Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      text-align: center;
    }
    
    .modal h2 {
      margin: 0 0 20px 0;
      font-size: 16px;
      color: #333;
    }
    
    #colorWheelCanvas {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px solid #ddd;
      margin: 0 auto 20px;
      cursor: crosshair;
      display: block;
    }
    
    #colorPreview {
      width: 100%;
      height: 50px;
      border: 2px solid #ddd;
      border-radius: 4px;
      margin: 0 0 20px 0;
      background: #000;
    }
    
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .modal-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .btn-confirm {
      background: #333;
      color: white;
    }
    
    .btn-cancel {
      background: #ddd;
      color: #333;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="stats">Zoom: 1.0x | Pressure: 0%</div>
  
  <div id="sidebar">
    <div class="section">
      <div class="section-label">Tools</div>
      <button class="btn active" data-tool="pen"><span class="emoji">🖊️</span>Pen</button>
      <button class="btn" data-tool="brush"><span class="emoji">🖌️</span>Brush</button>
      <button class="btn" data-tool="marker"><span class="emoji">🖍️</span>Marker</button>
      <button class="btn" data-tool="ink"><span class="emoji">✒️</span>Ink</button>
      <button class="btn" data-tool="pencil"><span class="emoji">✏️</span>Pencil</button>
    </div>
    
    <div class="section">
      <div class="section-label">Size</div>
      <input type="range" id="sizeSlider" min="1" max="50" value="3">
      <div class="size-value"><span id="sizeValue">3</span>px</div>
    </div>
    
    <div class="section">
      <div class="section-label">Color</div>
      <input type="color" id="colorInput" value="#000000">
    </div>
    
    <div class="section">
      <div class="section-label">Utilities</div>
      <button class="btn" id="colorWheelBtn"><span class="emoji">🎨</span>Wheel</button>
      <button class="btn" id="eyedropperBtn"><span class="emoji">🔍</span>Pick</button>
      <button class="btn" id="undoBtn"><span class="emoji">↶</span>Undo</button>
      <button class="btn" id="clearBtn"><span class="emoji">🗑️</span>Clear</button>
      <button class="btn" id="downloadBtn"><span class="emoji">⬇️</span>Save</button>
    </div>
  </div>
  
  <div id="colorWheelModal" class="modal">
    <div class="modal-content">
      <h2>Color Wheel</h2>
      <canvas id="colorWheelCanvas"></canvas>
      <div id="colorPreview"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeColorWheel()">Cancel</button>
        <button class="btn-confirm" onclick="confirmColorWheel()">Use Color</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    // Resize canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // State
    let state = {
      tool: 'pen',
      color: '#000000',
      size: 3,
      zoom: 1,
      panX: 0,
      panY: 0,
      isDrawing: false,
      pressure: 0,
      touchCount: 0,
      lastTouchDistance: 0
    };
    
    let history = [];
    let selectedColor = '#000000';
    let eyedropperActive = false;
    
    // Tool settings
    const tools = {
      pen: { width: 1.2, opacity: 1 },
      brush: { width: 3, opacity: 0.7 },
      marker: { width: 5, opacity: 0.6 },
      ink: { width: 1.5, opacity: 1 },
      pencil: { width: 0.8, opacity: 0.8 }
    };
    
    // Drawing
    function drawLine(fromX, fromY, toX, toY, pressure = 1) {
      const tool = tools[state.tool];
      const width = state.size * tool.width * pressure;
      const opacity = tool.opacity * pressure;
      
      ctx.strokeStyle = state.color;
      ctx.lineWidth = Math.max(0.5, width);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = opacity;
      
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      
      ctx.globalAlpha = 1;
    }
    
    function saveHistory() {
      history.push(canvas.toDataURL());
      if (history.length > 50) history.shift();
    }
    
    function undo() {
      if (history.length > 0) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = history.pop();
      }
    }
    
    // Pointer events (drawing with single pointer only)
    let lastX = 0, lastY = 0;
    
    canvas.addEventListener('pointerdown', (e) => {
      if (state.touchCount > 0 && e.pointerType === 'touch') return; // Ignore if already multi-touch
      if (e.button !== 0) return;
      
      state.isDrawing = true;
      state.pressure = e.pressure || 0.5;
      lastX = e.clientX;
      lastY = e.clientY;
      
      saveHistory();
      updateStats();
    });
    
    canvas.addEventListener('pointermove', (e) => {
      if (!state.isDrawing || e.isPrimary === false) return;
      
      state.pressure = e.pressure || 0.5;
      
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      
      if (!eyedropperActive) {
        drawLine(lastX, lastY, e.clientX, e.clientY, state.pressure);
      }
      
      lastX = e.clientX;
      lastY = e.clientY;
      
      updateStats();
    });
    
    canvas.addEventListener('pointerup', (e) => {
      state.isDrawing = false;
      state.pressure = 0;
      updateStats();
    });
    
    canvas.addEventListener('pointerleave', () => {
      state.isDrawing = false;
      state.pressure = 0;
    });
    
    // Touch events for pinch zoom (2 fingers only)
    canvas.addEventListener('touchstart', (e) => {
      state.touchCount = e.touches.length;
      
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        state.lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
      }
    }, { passive: true });
    
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2) {
        e.preventDefault();
        
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const currentDistance = Math.sqrt(dx * dx + dy * dy);
        
        if (state.lastTouchDistance > 0) {
          const ratio = currentDistance / state.lastTouchDistance;
          state.zoom *= ratio;
          state.zoom = Math.max(0.1, Math.min(state.zoom, 100));
          
          // Pan to center point
          const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          
          state.lastTouchDistance = currentDistance;
          updateStats();
        }
      }
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
      state.touchCount = e.touches.length;
      state.lastTouchDistance = 0;
    }, { passive: true });
    
    // Mouse wheel zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      
      const delta = e.deltaY > 0 ? 0.95 : 1.05;
      state.zoom *= delta;
      state.zoom = Math.max(0.1, Math.min(state.zoom, 100));
      
      updateStats();
    }, { passive: false });
    
    // Right-click pan
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
      }
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isPanning) {
        state.panX += e.clientX - panStartX;
        state.panY += e.clientY - panStartY;
        panStartX = e.clientX;
        panStartY = e.clientY;
      }
    });
    
    canvas.addEventListener('mouseup', () => {
      isPanning = false;
    });
    
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // UI Controls
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        e.target.closest('.btn').classList.add('active');
        state.tool = e.target.closest('.btn').dataset.tool;
      });
    });
    
    document.getElementById('sizeSlider').addEventListener('input', (e) => {
      state.size = parseInt(e.target.value);
      document.getElementById('sizeValue').textContent = state.size;
    });
    
    document.getElementById('colorInput').addEventListener('change', (e) => {
      state.color = e.target.value;
    });
    
    document.getElementById('colorWheelBtn').addEventListener('click', () => {
      document.getElementById('colorWheelModal').classList.add('active');
      drawColorWheel();
    });
    
    document.getElementById('eyedropperBtn').addEventListener('click', () => {
      eyedropperActive = !eyedropperActive;
      canvas.style.cursor = eyedropperActive ? 'crosshair' : 'default';
      document.getElementById('eyedropperBtn').classList.toggle('active');
      
      if (eyedropperActive) {
        canvas.addEventListener('click', pickColor);
      }
    });
    
    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Clear canvas?')) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        history = [];
      }
    });
    
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = `canvas-${Date.now()}.png`;
      link.click();
    });
    
    // Color wheel
    function drawColorWheel() {
      const wheelCanvas = document.getElementById('colorWheelCanvas');
      const wheelCtx = wheelCanvas.getContext('2d');
      const centerX = wheelCanvas.width / 2;
      const centerY = wheelCanvas.height / 2;
      const radius = 140;
      
      wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
      
      for (let angle = 0; angle < 360; angle++) {
        for (let r = 0; r < radius; r++) {
          const hue = angle;
          const saturation = 100 * (r / radius);
          wheelCtx.fillStyle = `hsl(${hue}, ${saturation}%, 50%)`;
          wheelCtx.beginPath();
          wheelCtx.arc(centerX, centerY, r, angle * Math.PI / 180, (angle + 1) * Math.PI / 180);
          wheelCtx.lineTo(centerX, centerY);
          wheelCtx.fill();
        }
      }
      
      wheelCanvas.addEventListener('click', selectColorFromWheel);
    }
    
    function selectColorFromWheel(e) {
      const rect = e.target.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const x = e.clientX - rect.left - centerX;
      const y = e.clientY - rect.top - centerY;
      const angle = Math.atan2(y, x) * 180 / Math.PI + 180;
      const distance = Math.sqrt(x * x + y * y);
      const saturation = 100 * Math.min(distance / 140, 1);
      
      selectedColor = `hsl(${angle}, ${saturation}%, 50%)`;
      document.getElementById('colorPreview').style.background = selectedColor;
    }
    
    window.closeColorWheel = () => {
      document.getElementById('colorWheelModal').classList.remove('active');
    };
    
    window.confirmColorWheel = () => {
      state.color = selectedColor;
      document.getElementById('colorInput').value = selectedColor;
      document.getElementById('colorWheelModal').classList.remove('active');
    };
    
    function pickColor(e) {
      const imageData = ctx.getImageData(e.clientX, e.clientY, 1, 1);
      const [r, g, b] = imageData.data;
      const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
      state.color = hex;
      document.getElementById('colorInput').value = hex;
      eyedropperActive = false;
      canvas.style.cursor = 'default';
      document.getElementById('eyedropperBtn').classList.remove('active');
      canvas.removeEventListener('click', pickColor);
    }
    
    function updateStats() {
      const pressurePercent = Math.round(state.pressure * 100);
      document.getElementById('stats').textContent = `Zoom: ${state.zoom.toFixed(2)}x | Pressure: ${pressurePercent}%`;
    }
    
    // Initial fill
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
