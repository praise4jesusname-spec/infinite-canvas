<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      background: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 8px;
      border: 1px solid #9caf88;
      border-radius: 6px;
      pointer-events: none;
      z-index: 3000;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 90px;
      height: 100vh;
      background: #e8f0df;
      border-right: 1px solid #9caf88;
      overflow-y: auto;
      z-index: 1000;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .section-label {
      font-size: 9px;
      font-weight: bold;
      color: #567348;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 5px;
    }
    
    .btn {
      width: 70px;
      padding: 8px;
      border: 1px solid #b8c9aa;
      background: #f8fbf5;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      color: #405238;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    
    .btn:hover {
      background: #d7e4cb;
      border-color: #789666;
    }
    
    .btn.active {
      background: #6f8f5f;
      color: white;
      border-color: #5b784c;
    }
    
    .btn.recording {
      background: #e74c3c;
      color: white;
      border-color: #e74c3c;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .emoji { font-size: 20px; }
    
    #colorInput {
      width: 70px;
      height: 35px;
      border: 1px solid #b8c9aa;
      border-radius: 4px;
      cursor: pointer;
    }
    
    #sizeSlider {
      width: 65px;
      height: 3px;
      cursor: pointer;
    }
    
    .size-value {
      font-size: 9px;
      color: #567348;
      text-align: center;
    }
    
    #stats {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(248,251,245,0.92);
      padding: 8px 12px;
      border: 1px solid #b8c9aa;
      border-radius: 4px;
      font-size: 11px;
      color: #567348;
      font-family: monospace;
      z-index: 999;
    }
    
    #recordingIndicator {
      position: fixed;
      top: 10px;
      left: 110px;
      background: #e74c3c;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 999;
      display: none;
      animation: pulse 1s infinite;
    }
    
    #recordingIndicator.active {
      display: block;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      text-align: center;
    }
    
    .modal h2 {
      margin: 0 0 20px 0;
      font-size: 16px;
      color: #333;
    }
    
    #colorWheelCanvas {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px solid #ddd;
      margin: 0 auto 20px;
      cursor: crosshair;
      display: block;
    }
    
    #colorPreview {
      width: 100%;
      height: 50px;
      border: 2px solid #ddd;
      border-radius: 4px;
      margin: 0 0 20px 0;
      background: #000;
    }
    
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .modal-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .btn-confirm {
      background: #333;
      color: white;
    }
    
    .btn-cancel {
      background: #ddd;
      color: #333;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="stats">Zoom: 1.0x | Pressure: 0% | Strokes: 0</div>
  <div id="recordingIndicator">● REC <span id="recordingTime">00:00</span></div>
  
  <div id="sidebar">
    <div class="section">
      <div class="section-label">Tools</div>
      <button class="btn active" data-tool="pen"><span class="emoji">🖊️</span>Pen</button>
      <button class="btn" data-tool="brush"><span class="emoji">🖌️</span>Brush</button>
      <button class="btn" data-tool="marker"><span class="emoji">🖍️</span>Marker</button>
      <button class="btn" data-tool="ink"><span class="emoji">✒️</span>Ink</button>
      <button class="btn" data-tool="pencil"><span class="emoji">✏️</span>Pencil</button>
    </div>
    
    <div class="section">
      <div class="section-label">Size</div>
      <input type="range" id="sizeSlider" min="1" max="50" value="3">
      <div class="size-value"><span id="sizeValue">3</span>px</div>
    </div>
    
    <div class="section">
      <div class="section-label">Color</div>
      <input type="color" id="colorInput" value="#000000">
    </div>
    
    <div class="section">
      <div class="section-label">Utilities</div>
      <button class="btn" id="colorWheelBtn"><span class="emoji">🎨</span>Wheel</button>
      <button class="btn" id="undoBtn"><span class="emoji">↶</span>Undo</button>
      <button class="btn" id="clearBtn"><span class="emoji">🗑️</span>Clear</button>
      <button class="btn" id="downloadBtn"><span class="emoji">⬇️</span>Save</button>
    </div>

    <div class="section">
      <div class="section-label">Record</div>
      <button class="btn" id="recordBtn"><span class="emoji">⏺️</span>Record</button>
    </div>
  </div>
  
  <div id="colorWheelModal" class="modal">
    <div class="modal-content">
      <h2>Color Wheel</h2>
      <canvas id="colorWheelCanvas"></canvas>
      <div id="colorPreview"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeColorWheel()">Cancel</button>
        <button class="btn-confirm" onclick="confirmColorWheel()">Use Color</button>
      </div>
    </div>
  </div>

  <script>
    // ===== VECTOR-BASED INFINITE CANVAS WITH FRACTAL RENDERING =====
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', {
      alpha: false,
      desynchronized: true
    });
    
    // High DPI support
    let dpr = window.devicePixelRatio || 1;
    
    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
    }
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      requestRender();
    });
    
    // ===== VECTOR MATH =====
    class Vec2 {
      constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
      }
      
      add(v) {
        return new Vec2(this.x + v.x, this.y + v.y);
      }
      
      sub(v) {
        return new Vec2(this.x - v.x, this.y - v.y);
      }
      
      mul(scalar) {
        return new Vec2(this.x * scalar, this.y * scalar);
      }
      
      div(scalar) {
        return new Vec2(this.x / scalar, this.y / scalar);
      }
      
      dot(v) {
        return this.x * v.x + this.y * v.y;
      }
      
      length() {
        return Math.sqrt(this.x * this.x + this.y * this.y);
      }
      
      normalize() {
        const len = this.length();
        return len > 0 ? this.div(len) : new Vec2(0, 0);
      }
      
      distance(v) {
        return this.sub(v).length();
      }
      
      lerp(v, t) {
        return this.add(v.sub(this).mul(t));
      }
      
      clone() {
        return new Vec2(this.x, this.y);
      }
    }
    
    // ===== VECTOR STROKE =====
    class Stroke {
      constructor(tool, color, baseSize) {
        this.points = []; // Array of {pos: Vec2, pressure: number, timestamp: number}
        this.tool = tool;
        this.color = color;
        this.baseSize = baseSize;
      }
      
      addPoint(pos, pressure, timestamp) {
        this.points.push({ pos: pos.clone(), pressure, timestamp });
      }
      
      getSegment(startIdx, endIdx) {
        return this.points.slice(startIdx, endIdx + 1);
      }
    }
    
    // ===== BRUSH DYNAMICS (Endless Paper Style) =====
    const brushDynamics = {
      pen: {
        baseWidth: 1.5,
        pressureSensitivity: 0.8,
        velocityTaper: 0.2,
        softness: 0,
        opacity: 1
      },
      brush: {
        baseWidth: 4,
        pressureSensitivity: 1,
        velocityTaper: 0.5,
        softness: 0.4,
        opacity: 0.8
      },
      marker: {
        baseWidth: 6,
        pressureSensitivity: 0.5,
        velocityTaper: 0.3,
        softness: 0.6,
        opacity: 0.7
      },
      ink: {
        baseWidth: 2,
        pressureSensitivity: 1,
        velocityTaper: 0.1,
        softness: 0,
        opacity: 1
      },
      pencil: {
        baseWidth: 1,
        pressureSensitivity: 0.7,
        velocityTaper: 0.4,
        softness: 0.2,
        opacity: 0.9
      }
    };
    
    // ===== FRACTAL RENDERING ENGINE =====
    class FractalRenderer {
      constructor(ctx, zoom) {
        this.ctx = ctx;
        this.zoom = zoom;
        this.panX = 0;
        this.panY = 0;
        this.originX = 0;
        this.originY = 0;
        this.viewport = null;
        this.brushTextures = new Map();
        this.layers = new Map(); // LOD (Level of Detail) layers
      }
      
      // Compute width based on velocity and pressure (Endless Paper style)
      computeWidth(prevPos, currPos, pressure, dynamics, baseSize) {
        const velocity = prevPos ? prevPos.distance(currPos) * this.zoom : 0;
        const velocityFactor = Math.pow(Math.max(0.1, 1 - velocity * 0.01), dynamics.velocityTaper);
        const widthFromPressure = dynamics.baseWidth * (baseSize / 3) *
          (0.5 + pressure * dynamics.pressureSensitivity);
        return widthFromPressure * velocityFactor;
      }
      
      // Render each stroke as one continuous variable-width ribbon.
      renderStroke(stroke, startIdx = 0, endIdx = null) {
        if (endIdx === null) endIdx = stroke.points.length - 1;
        if (stroke.points.length === 1) {
          const point = stroke.points[0];
          const dynamics = brushDynamics[stroke.tool];
          const width = this.computeWidth(null, point.pos, point.pressure, dynamics, stroke.baseSize);
          this.drawBrushDot(point.pos, width, stroke.color, dynamics);
          return;
        }

        if (startIdx >= endIdx) return;
        
        const dynamics = brushDynamics[stroke.tool];
        const points = stroke.points;
        const samples = [];
        const flushSamples = () => {
          if (samples.length > 1) {
            this.drawBrushStroke(samples, stroke.color, dynamics);
          }
          samples.length = 0;
        };
        
        // Adaptive Catmull-Rom spline sampling in screen-space.
        for (let i = startIdx; i < endIdx; i++) {
          const p0 = i > 0 ? points[i - 1].pos : points[i].pos;
          const p1 = points[i].pos;
          const p2 = points[i + 1].pos;
          const p3 = i < points.length - 2 ? points[i + 2].pos : points[i + 1].pos;

          if (!this.isSegmentVisible(p0, p1, p2, p3, stroke.baseSize)) {
            flushSamples();
            continue;
          }
          
          const pressure1 = points[i].pressure;
          const pressure2 = points[i + 1].pressure;
          
          const segments = Math.min(64, Math.max(2, Math.ceil(p1.distance(p2) * this.zoom * 0.25)));
          
          for (let t = 0; t <= segments; t++) {
            if (i > startIdx && t === 0) continue;

            const tau = t / segments;
            const tau2 = tau * tau;
            const tau3 = tau2 * tau;
            
            // Catmull-Rom interpolation
            const q = p0.mul(-0.5 * tau3 + tau2 - 0.5 * tau)
              .add(p1.mul(1.5 * tau3 - 2.5 * tau2 + 1))
              .add(p2.mul(-1.5 * tau3 + 2 * tau2 + 0.5 * tau))
              .add(p3.mul(0.5 * tau3 - 0.5 * tau2));
            
            const pressure = pressure1 + (pressure2 - pressure1) * tau;
            const width = this.computeWidth(p1, q, pressure, dynamics, stroke.baseSize);
            const lastSample = samples[samples.length - 1];
            if (lastSample && lastSample.pos.distance(q) < 0.001) {
              lastSample.width = width;
            } else {
              samples.push({ pos: q, width });
            }
          }
        }

        flushSamples();
      }

      isSegmentVisible(p0, p1, p2, p3, baseSize) {
        if (!this.viewport) return true;

        const padding = Math.max(8, baseSize * 2) / this.zoom;
        const minX = Math.min(p0.x, p1.x, p2.x, p3.x);
        const maxX = Math.max(p0.x, p1.x, p2.x, p3.x);
        const minY = Math.min(p0.y, p1.y, p2.y, p3.y);
        const maxY = Math.max(p0.y, p1.y, p2.y, p3.y);
        const { left, right, top, bottom } = this.viewport;

        return maxX >= left - padding && minX <= right + padding &&
          maxY >= top - padding && minY <= bottom + padding;
      }
      
      drawBrushStroke(samples, color, dynamics) {
        if (samples.length < 2) return;

        const screenSamples = samples.map(sample => ({
          pos: this.worldToScreen(sample.pos),
          width: sample.width
        }));

        this.drawBrushStamp(screenSamples[0].pos, screenSamples[0].width, color, dynamics);
        for (let i = 1; i < screenSamples.length; i++) {
          const previous = screenSamples[i - 1];
          const current = screenSamples[i];
          const distance = previous.pos.distance(current.pos);
          const spacing = Math.max(0.5, Math.min(previous.width, current.width) * 0.2);
          const steps = Math.max(1, Math.ceil(distance / spacing));

          for (let step = 1; step <= steps; step++) {
            const progress = step / steps;
            const position = previous.pos.lerp(current.pos, progress);
            const width = previous.width + (current.width - previous.width) * progress;
            this.drawBrushStamp(position, width, color, dynamics);
          }
        }
      }

      drawBrushDot(pos, width, color, dynamics) {
        this.drawBrushStamp(this.worldToScreen(pos), width, color, dynamics);
      }

      drawBrushStamp(pos, width, color, dynamics) {
        const texture = this.getBrushTexture(color, width, dynamics);
        this.ctx.globalAlpha = dynamics.opacity;
        this.ctx.drawImage(
          texture.canvas,
          pos.x - texture.cssSize / 2,
          pos.y - texture.cssSize / 2,
          texture.cssSize,
          texture.cssSize
        );
        this.ctx.globalAlpha = 1;
      }

      getBrushTexture(color, width, dynamics) {
        const diameter = Math.max(1, Math.round(width * 2) / 2);
        const key = `${color}:${diameter}:${dynamics.softness}:${dpr}`;
        const cachedTexture = this.brushTextures.get(key);
        if (cachedTexture) return cachedTexture;

        if (this.brushTextures.size >= 256) this.brushTextures.clear();

        const padding = Math.max(2, diameter * (0.25 + dynamics.softness * 0.5));
        const cssSize = diameter + padding * 2;
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = Math.ceil(cssSize * dpr);
        textureCanvas.height = Math.ceil(cssSize * dpr);
        const textureCtx = textureCanvas.getContext('2d');
        textureCtx.scale(dpr, dpr);

        const center = cssSize / 2;
        const radius = diameter / 2 + padding;
        const solidEdge = Math.max(0.15, 0.82 - dynamics.softness * 0.45);
        const gradient = textureCtx.createRadialGradient(center, center, 0, center, center, radius);
        gradient.addColorStop(0, color);
        gradient.addColorStop(solidEdge, color);
        gradient.addColorStop(1, 'transparent');
        textureCtx.fillStyle = gradient;
        textureCtx.fillRect(0, 0, cssSize, cssSize);

        const texture = { canvas: textureCanvas, cssSize };
        this.brushTextures.set(key, texture);
        return texture;
      }

      worldToScreen(pos) {
        return new Vec2(
          (pos.x - this.originX) * this.zoom + this.panX,
          (pos.y - this.originY) * this.zoom + this.panY
        );
      }
    }
    
    // ===== STATE MANAGEMENT =====
    let state = {
      tool: 'pen',
      color: '#000000',
      size: 3,
      zoom: 1,
      panX: 0,
      panY: 0,
      originX: 0,
      originY: 0,
      isDrawing: false,
      pressure: 0,
      lastTouchDistance: 0,
      lastTouchCenter: null,
      isRecording: false,
      velocity: new Vec2(0, 0)
    };
    
    let strokes = []; // All vector strokes
    let currentStroke = null;
    let history = [];
    let selectedColor = '#000000';
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartTime = 0;
    let recordingInterval = null;
    let renderer = new FractalRenderer(ctx, state.zoom);
    
    let lastX = 0, lastY = 0;
    let lastTime = 0;
    let renderScheduled = false;
    const activeTouchPointers = new Map();

    function requestRender() {
      if (!renderScheduled) {
        renderScheduled = true;
        requestAnimationFrame(render);
      }
    }

    function rebaseCamera() {
      if (Math.abs(state.panX) < 4096 && Math.abs(state.panY) < 4096) return;

      const originShiftX = -state.panX / state.zoom;
      const originShiftY = -state.panY / state.zoom;
      if (!Number.isFinite(originShiftX) || !Number.isFinite(originShiftY)) return;

      state.originX += originShiftX;
      state.originY += originShiftY;
      state.panX = 0;
      state.panY = 0;
    }

    function setCamera(nextZoom, worldAnchor, screenAnchor) {
      if (!Number.isFinite(nextZoom) || nextZoom <= 0) return false;

      const nextPanX = screenAnchor.x - (worldAnchor.x - state.originX) * nextZoom;
      const nextPanY = screenAnchor.y - (worldAnchor.y - state.originY) * nextZoom;
      if (!Number.isFinite(nextPanX) || !Number.isFinite(nextPanY)) return false;

      state.zoom = nextZoom;
      state.panX = nextPanX;
      state.panY = nextPanY;
      rebaseCamera();
      renderer.zoom = state.zoom;
      updateStats();
      requestRender();
      return true;
    }

    function zoomAt(factor, clientX, clientY) {
      const oldZoom = state.zoom;
      const nextZoom = oldZoom * factor;
      const worldAnchor = new Vec2(
        (clientX - state.panX) / oldZoom + state.originX,
        (clientY - state.panY) / oldZoom + state.originY
      );
      setCamera(nextZoom, worldAnchor, new Vec2(clientX, clientY));
    }

    function updateTouchGesture() {
      if (activeTouchPointers.size < 2) {
        state.lastTouchDistance = 0;
        state.lastTouchCenter = null;
        return;
      }

      const [firstTouch, secondTouch] = activeTouchPointers.values();
      const dx = firstTouch.x - secondTouch.x;
      const dy = firstTouch.y - secondTouch.y;
      const distance = Math.hypot(dx, dy);
      const center = new Vec2(
        (firstTouch.x + secondTouch.x) / 2,
        (firstTouch.y + secondTouch.y) / 2
      );

      if (distance > 0 && state.lastTouchDistance > 0 && state.lastTouchCenter) {
        const worldAnchor = new Vec2(
          (state.lastTouchCenter.x - state.panX) / state.zoom + state.originX,
          (state.lastTouchCenter.y - state.panY) / state.zoom + state.originY
        );
        setCamera(state.zoom * (distance / state.lastTouchDistance), worldAnchor, center);
      }

      state.lastTouchDistance = distance;
      state.lastTouchCenter = center;
    }
    
    // ===== RENDERING LOOP =====
    function render() {
      renderScheduled = false;

      // Clear canvas
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      
      // Apply pan and zoom transforms
      renderer.viewport = {
        left: state.originX - state.panX / state.zoom,
        right: state.originX + (window.innerWidth - state.panX) / state.zoom,
        top: state.originY - state.panY / state.zoom,
        bottom: state.originY + (window.innerHeight - state.panY) / state.zoom
      };
      renderer.zoom = state.zoom;
      renderer.panX = state.panX;
      renderer.panY = state.panY;
      renderer.originX = state.originX;
      renderer.originY = state.originY;
      
      // Draw all strokes
      for (const stroke of strokes) {
        renderer.renderStroke(stroke);
      }
      if (currentStroke) {
        renderer.renderStroke(currentStroke);
      }
      
    }
    requestRender();
    
    // ===== POINTER EVENTS =====
    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);

      if (e.pointerType === 'touch') {
        activeTouchPointers.set(e.pointerId, new Vec2(e.clientX, e.clientY));
        if (activeTouchPointers.size >= 2) {
          currentStroke = null;
          state.isDrawing = false;
          updateTouchGesture();
          return;
        }
      }
      state.isDrawing = true;
      state.pressure = e.pressure || 0.5;
      state.pressure = e.pressure || 0.5;
      
      const pos = new Vec2(
        (e.clientX - state.panX) / state.zoom + state.originX,
        (e.clientY - state.panY) / state.zoom + state.originY
      );
      
      lastX = pos.x;
      lastY = pos.y;
      lastTime = performance.now();
      
      currentStroke = new Stroke(state.tool, state.color, state.size);
      currentStroke.addPoint(pos, state.pressure, lastTime);
      
      history.push(JSON.stringify(strokes));
      if (history.length > 50) history.shift();
      requestRender();
    });
    
    function appendStrokePoint(e) {
      state.pressure = e.pressure || 0.5;
      
      const pos = new Vec2(
        (e.clientX - state.panX) / state.zoom + state.originX,
        (e.clientY - state.panY) / state.zoom + state.originY
      );
      
      const now = e.timeStamp || performance.now();
      const deltaTime = now - lastTime;
      
      if (deltaTime > 0) {
        state.velocity = new Vec2(
          (pos.x - lastX) / deltaTime,
          (pos.y - lastY) / deltaTime
        );
      }
      
      currentStroke.addPoint(pos, state.pressure, now);
      lastX = pos.x;
      lastY = pos.y;
      lastTime = now;
    }

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch' && activeTouchPointers.has(e.pointerId)) {
        activeTouchPointers.set(e.pointerId, new Vec2(e.clientX, e.clientY));
        if (activeTouchPointers.size >= 2) {
          updateTouchGesture();
          return;
        }
      }

      if (!state.isDrawing || e.isPrimary === false) return;

      const coalescedEvents = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const pointEvent of coalescedEvents) {
        appendStrokePoint(pointEvent);
      }
      
      updateStats();
      requestRender();
    });
    
    function finishStroke(e) {
      if (e.pointerType === 'touch') {
        activeTouchPointers.delete(e.pointerId);
        updateTouchGesture();
      }
      if (state.isDrawing && currentStroke) {
        strokes.push(currentStroke);
        currentStroke = null;
      }
      if (e.currentTarget.hasPointerCapture(e.pointerId)) {
        e.currentTarget.releasePointerCapture(e.pointerId);
      }
      state.isDrawing = false;
      state.pressure = 0;
      updateStats();
      requestRender();
    }
    
    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);
    
    // ===== MOUSE WHEEL ZOOM =====
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      
      zoomAt(Math.exp(-e.deltaY * 0.001), e.clientX, e.clientY);
    }, { passive: false });
    
    // ===== PAN (RIGHT CLICK) =====
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
      }
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isPanning) {
        state.panX += e.clientX - panStartX;
        state.panY += e.clientY - panStartY;
        panStartX = e.clientX;
        panStartY = e.clientY;
        rebaseCamera();
        requestRender();
      }
    });
    
    canvas.addEventListener('mouseup', () => {
      isPanning = false;
    });
    
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // ===== UI CONTROLS =====
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        e.target.closest('.btn').classList.add('active');
        state.tool = e.target.closest('.btn').dataset.tool;
      });
    });
    
    document.getElementById('sizeSlider').addEventListener('input', (e) => {
      state.size = parseInt(e.target.value);
      document.getElementById('sizeValue').textContent = state.size;
    });
    
    document.getElementById('colorInput').addEventListener('change', (e) => {
      state.color = e.target.value;
    });
    
    document.getElementById('colorWheelBtn').addEventListener('click', () => {
      document.getElementById('colorWheelModal').classList.add('active');
      drawColorWheel();
    });
    
    document.getElementById('undoBtn').addEventListener('click', () => {
      if (strokes.length > 0) {
        strokes.pop();
        updateStats();
        requestRender();
      }
    });
    
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Clear canvas?')) {
        strokes = [];
        history = [];
        updateStats();
        requestRender();
      }
    });
    
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `canvas-${Date.now()}.png`;
      link.click();
    });
    
    document.getElementById('recordBtn').addEventListener('click', () => {
      if (!state.isRecording) startRecording();
      else stopRecording();
    });
    
    async function startRecording() {
      try {
        const stream = canvas.captureStream(60);
        recordedChunks = [];
        const preferredOptions = {
          mimeType: 'video/webm;codecs=vp9',
          videoBitsPerSecond: 5000000
        };
        mediaRecorder = MediaRecorder.isTypeSupported(preferredOptions.mimeType)
          ? new MediaRecorder(stream, preferredOptions)
          : new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `canvas-recording-${Date.now()}.webm`;
          link.click();
          URL.revokeObjectURL(url);
        };
        
        mediaRecorder.start();
        state.isRecording = true;
        recordingStartTime = Date.now();
        
        recordingInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
          const minutes = Math.floor(elapsed / 60);
          const seconds = elapsed % 60;
          document.getElementById('recordingTime').textContent = 
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }, 100);
        
        document.getElementById('recordBtn').classList.add('recording');
        document.getElementById('recordingIndicator').classList.add('active');
      } catch (err) {
        console.error('Unable to start recording.', err);
        alert('Recording could not be started in this browser.');
      }
    }
    
    function stopRecording() {
      if (mediaRecorder && state.isRecording) {
        mediaRecorder.stop();
        state.isRecording = false;
        clearInterval(recordingInterval);
        document.getElementById('recordBtn').classList.remove('recording');
        document.getElementById('recordingIndicator').classList.remove('active');
        document.getElementById('recordingTime').textContent = '00:00';
      }
    }
    
    function drawColorWheel() {
      const wheelCanvas = document.getElementById('colorWheelCanvas');
      const wheelCtx = wheelCanvas.getContext('2d');
      const centerX = wheelCanvas.width / 2;
      const centerY = wheelCanvas.height / 2;
      const radius = 140;
      
      wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
      
      for (let angle = 0; angle < 360; angle++) {
        for (let r = 0; r < radius; r++) {
          const hue = angle;
          const saturation = 100 * (r / radius);
          wheelCtx.fillStyle = `hsl(${hue}, ${saturation}%, 50%)`;
          wheelCtx.beginPath();
          wheelCtx.arc(centerX, centerY, r, angle * Math.PI / 180, (angle + 1) * Math.PI / 180);
          wheelCtx.lineTo(centerX, centerY);
          wheelCtx.fill();
        }
      }
      wheelCanvas.removeEventListener('click', selectColorFromWheel);
      wheelCanvas.addEventListener('click', selectColorFromWheel);
    }
    
    function selectColorFromWheel(e) {
      const rect = e.target.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const x = e.clientX - rect.left - centerX;
      const y = e.clientY - rect.top - centerY;
      const angle = Math.atan2(y, x) * 180 / Math.PI + 180;
      const distance = Math.sqrt(x * x + y * y);
      const saturation = 100 * Math.min(distance / 140, 1);
      selectedColor = `hsl(${angle}, ${saturation}%, 50%)`;
      document.getElementById('colorPreview').style.background = selectedColor;
    }
    
    window.closeColorWheel = () => {
      document.getElementById('colorWheelModal').classList.remove('active');
    };
    
    window.confirmColorWheel = () => {
      state.color = selectedColor;
      document.getElementById('colorInput').value = selectedColor;
      document.getElementById('colorWheelModal').classList.remove('active');
    };
    
    function updateStats() {
      const pressurePercent = Math.round(state.pressure * 100);
      const zoomLabel = state.zoom < 0.01 || state.zoom >= 10000
        ? state.zoom.toExponential(2)
        : state.zoom.toFixed(2);
      document.getElementById('stats').textContent = 
        `Zoom: ${zoomLabel}x | Pressure: ${pressurePercent}% | Strokes: ${strokes.length}`;
    }
  </script>
</body>
</html>
